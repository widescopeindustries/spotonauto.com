worker_processes 4;
pid /run/alloem-manual-cache/nginx.pid;
error_log /srv/alloem-manuals/logs/error.log warn;
user www-data;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 20;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_cache_path /srv/alloem-manuals/cache/html levels=1:2 keys_zone=manual_html_v1:256m max_size=50g min_free=50g inactive=30d use_temp_path=off;
    proxy_cache_path /srv/alloem-manuals/cache/media levels=1:2 keys_zone=manual_media_v1:128m max_size=100g min_free=50g inactive=60d use_temp_path=off;
    proxy_temp_path /srv/alloem-manuals/tmp/proxy;
    client_body_temp_path /srv/alloem-manuals/tmp/client;
    upstream archive_media {
        zone archive_media 64k;
        server 127.0.0.1:8080 max_conns=32;
        keepalive 16;
    }

    map $http_accept $manual_accept_private { default 0; ~*(application/json|text/markdown|text/x-component) 1; }
    map $http_cookie $manual_cookie_private {
        default 0;
        "~*(^|;)[[:space:]]*(__Host-|__Secure-next-auth|next-auth|auth|session|sb-[^=]*auth-token|__session|clerk)" 1;
    }
    map "${http_rsc}${http_next_router_state_tree}${http_next_router_prefetch}${http_next_router_segment_prefetch}${http_next_action}${http_authorization}${arg__rsc}" $manual_sensitive { "" 0; default 1; }
    map "${manual_sensitive}:${manual_cookie_private}:${manual_accept_private}:$request_method" $manual_cache_skip { default 1; "0:0:0:GET" 0; "0:0:0:HEAD" 0; }
    map $manual_cache_skip $manual_vary { 0 "Accept-Encoding"; 1 "RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch, Accept-Encoding, Accept"; }
    map "$manual_cache_skip:$status" $manual_response_cache {
        default "no-store, max-age=0";
        "0:200" "public, max-age=0, s-maxage=86400, stale-while-revalidate=60, stale-if-error=86400";
        "0:404" "public, max-age=0, s-maxage=30";
    }
    map $uri $manual_media_allowed { default 0; ~^/manual-media/(images25|images|icons)/ 1; }
    split_clients "$request_id" $manual_log_sample { 10% 1; * 0; }
    map $request_uri $manual_log_path { default $uri; "~^(?<manual_raw_path>[^?]*)" $manual_raw_path; }
    map "$status:$upstream_cache_status:$manual_log_sample" $manual_loggable { default 1; "200:HIT:0" 0; }
    log_format delivery escape=json '{"ts":"$time_iso8601","status":$status,"uri":"$manual_log_path","uri_encoding":"raw","cache":"$upstream_cache_status","rt":$request_time,"urt":"$upstream_response_time","up":"$upstream_status","private":$manual_cache_skip,"bytes":$body_bytes_sent}';
    access_log /srv/alloem-manuals/logs/access.jsonl delivery if=$manual_loggable;

    server {
        listen 127.0.0.1:3022;
        server_name alloem-manual-cache;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_connect_timeout 1s;
        proxy_read_timeout 17s;
        proxy_send_timeout 5s;
        location = /_health { access_log off; default_type text/plain; return 200 "ok\n"; }

        location ^~ /manual-media/ {
            if ($manual_media_allowed = 0) { return 404; }
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://archive_media/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host alloemmanuals.com;
            proxy_cache manual_media_v1;
            proxy_cache_key "media-v1|$request_uri";
            proxy_cache_lock on;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_intercept_errors on;
            error_page 502 504 = @media_busy;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Cache-Status $upstream_cache_status always;
        }
        location @media_busy {
            add_header Cache-Control "no-store, max-age=0" always;
            add_header Retry-After 2 always;
            return 503;
        }

        location / {
            if ($request_uri !~ ^/manual(?:/|\?|$)) { return 404; }
            proxy_pass http://127.0.0.1:3020;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host alloemmanuals.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache manual_html_v1;
            proxy_cache_key "manual-v2|GET|$request_uri";
            proxy_cache_bypass $manual_cache_skip;
            proxy_no_cache $manual_cache_skip $upstream_http_set_cookie;
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Cache-Control;
            proxy_hide_header Vary;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 12s;
            proxy_cache_lock_age 12s;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header Cache-Control $manual_response_cache always;
            add_header Vary $manual_vary always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
