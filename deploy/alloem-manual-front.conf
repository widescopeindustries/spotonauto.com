# Loaded by the fleet's main Nginx, in http context. Workers remain independent.
upstream alloem_manual_front {
    zone alloem_manual_front 64k;
    server 127.0.0.1:3022 max_fails=2 fail_timeout=3s;
    server 127.0.0.1:3020 backup;
    keepalive 32;
}
upstream alloem_manual_media_backup {
    zone alloem_manual_media_backup 64k;
    server 127.0.0.1:8080 max_conns=16;
    keepalive 8;
}
map "$cloudflare_trusted:$http_cf_connecting_ip" $manual_client_key {
    default $binary_remote_addr;
    "~^1:(.+)$" $http_cf_connecting_ip;
}
limit_req_zone $manual_client_key zone=manual_fair_client:10m rate=100r/s;
map $uri $manual_public_media_allowed { default 0; ~^/manual-media/(images25|images|icons)/ 1; }
