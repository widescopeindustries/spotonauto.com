server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name alloemmanuals.com www.alloemmanuals.com;

    if ($host = spotonauto.com) { return 308 https://alloemmanuals.com$request_uri; }
    if ($host = www.spotonauto.com) { return 308 https://alloemmanuals.com$request_uri; }

    if ($cloudflare_trusted = 0) { return 444; }

    ssl_certificate /etc/letsencrypt/live/alloemmanuals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alloemmanuals.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
    proxy_hide_header X-Content-Type-Options;

    proxy_cache alloemmanuals_cache;
    proxy_cache_valid 200 301 1h;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_methods GET HEAD;
    proxy_cache_key $scheme$request_method$host$request_uri$http_accept$http_authorization;
    add_header X-Cache-Status $upstream_cache_status always;

    limit_req zone=botlimit burst=50 nodelay;

    # Immediate 403 block for bad scrapers at Nginx Edge
    if ($is_bad_scraper = 1) {
        return 403;
    }

    # Independent measurement never reaches Next, content cache, or ad routing.
    location ^~ /_audience/ {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_cache off;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        client_max_body_size 12k;
        access_log off;
        limit_req zone=audience_ingest burst=80 nodelay;
    }


    location ^~ /manual-media/ {
        if ($manual_public_media_allowed = 0) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=manual_fair_client burst=200 nodelay;
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_connect_timeout 1s;
        proxy_read_timeout 18s;
        proxy_intercept_errors on;
        error_page 502 504 = @manual_media_backup;
    }
    location @manual_media_backup {
        rewrite ^/manual-media/(.*)$ /$1 break;
        proxy_pass http://alloem_manual_media_backup;
        proxy_cache alloemmanuals_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 30s;
        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

location = /tools/sitemap.xml {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache off;
    }

    location ^~ /tools {
        if ($is_bad_scraper = 1) { return 403; }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=3600, s-maxage=604800" always;
        add_header Vary "Accept-Encoding" always;
        proxy_cache_valid 200 301 1h;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /repair/sitemap.xml {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache off;
    }

    location ^~ /repair {
        if ($is_bad_scraper = 1) { return 403; }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=1800, s-maxage=604800" always;
        add_header Vary "Accept-Encoding" always;
        proxy_cache_valid 200 301 30m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/ {
        if ($is_bad_scraper = 1) { return 403; }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        send_timeout 180s;
        proxy_cache off;
    }

    location = /ads.txt {
        alias /data/alloem-public-assets/ads.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Content-Type;
        add_header Content-Type text/plain;
        proxy_cache off;
    }

    location = /sitemap-priority-winners.xml {
        root /var/www/alloemmanuals;
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location ~* /sitemap {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache off;
    }

    location = /tools/chevrolet-traverse-spark-plug-type { return 301 /tools/chevrolet-traverse-tire-size; }
    location = /tools/subaru-wrx-serpentine-belt { return 301 /manual/Subaru; }
    location = /tools/chevrolet-equinox-spark-plug-type { return 301 /manual/Chevrolet; }
    location ~ "^/repair/([0-9]{4})/honda/cr-v(/.*)?$" { return 301 /repair/$1/honda/crv$2; }

    location = /_nodes/_local {
        if ($http_user_agent ~* "Amazon-Route53-Health-Check-Service") {
            add_header Content-Type "application/json" always;
            return 200 "{\"status\":\"ok\",\"note\":\"Route53 health check endpoint\"}";
        }
        return 444;
    }

    location = /.well-known/traffic-advice {
        add_header Content-Type "application/json" always;
        return 204;
    }

    location ~* "^/(\.env|\.git/|\.aws/|\.config/|\.claude/|\.credentials|wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpunit|vendor/|admin/|admin\.php|phpmyadmin|mysql\.sql|debug\.log|_nodes/|classwithtostring\.php|officialsite|ipfs/|api/v1/courses|Alvin9999)" {
        return 444;
    }

    location ~* \.php$ { return 444; }


    location = / {
        if ($is_bad_scraper = 1) { return 403; }
        if ($request_method !~ ^(GET|HEAD)$) { return 444; }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=1800, s-maxage=604800" always;
        add_header Vary "Accept-Encoding" always;
    }


    # Isolated manual delivery; cache before bounded renderer admission.
    location ^~ /_next/static/ {
        alias /data/alloem-public-assets/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /api/internal/ { return 404; }
    location = /manual/sitemap.xml {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_cache off;
    }
    location = /manual { include /etc/nginx/snippets/alloem-manual-proxy.conf; }

    location ^~ /manual/ { include /etc/nginx/snippets/alloem-manual-proxy.conf; }

    location / {
        if ($is_bad_scraper = 1) { return 403; }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        send_timeout 180s;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=1800, s-maxage=604800" always;
        add_header Vary "Accept-Encoding" always;
        proxy_cache_valid 200 301 30m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
